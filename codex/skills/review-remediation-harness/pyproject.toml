[project]
name = "review-harness-artifacts"
version = "2.0.0"
description = "Append-only artifact writer and validator for the personal review-remediation Harness"
requires-python = ">=3.11"
dependencies = [
  "rfc8785==0.1.4",
]

[project.scripts]
review-harness-artifacts = "review_harness_artifacts.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_harness_artifacts"]
